services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    expose:
      - "1025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - network-vcnafacul
    volumes:
      - mailpit_data:/data

volumes:
  mailpit_data:


networks:
  network-vcnafacul:
    external: true
