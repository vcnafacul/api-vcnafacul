# =============================================================================
# main - CI only (deploy é feito via tag no release.yml)
# =============================================================================

name: CI Main

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]

jobs:
  CI:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3307:3306
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: vcnafacul
    steps:
      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
      - name: Install sharp depend
        run: yarn add sharp --ignore-engines
      - name: Install depends
        run: yarn
      - name: Build app vCnafacul
        run: yarn build
      - name: Install Dotenv-cli
        run: npm install -g dotenv-cli
      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3307 -u root -p123456 --silent 2>/dev/null; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
      - name: Run Migrations
        run: dotenv -e ./test/.env.test -- yarn typeorm migration:run
      - name: Run tests
        run: dotenv -e ./test/.env.test -- yarn test --forceExit --detectOpenHandles
        timeout-minutes: 15
