name: vCnafacul
on:
  pull_request:
    branches: ['develop']
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ⚠️ 4 shards em paralelo, cada um com SEU MySQL (tickets/051 · 01). Os e2e
  # fazem UPDATE/DELETE por tabela, então o paralelismo é entre jobs, nunca
  # entre workers no mesmo banco. A cobertura de cada shard vira artifact e o
  # job COBERTURA junta e confere os limites do jest-e2e.json.
  # Não usa o `test.sh`: ele sobe outro MySQL e repete as migrations.
  # Cache do yarn pelo setup-node (051 · 02): o `yarn add sharp` que havia aqui
  # era redundante — o sharp já está no package.json.
  CI:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3307:3306
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: vcnafacul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "yarn"
      - name: Install depends
        # --frozen-lockfile: a CI instala o que está no lock, nunca o atualiza.
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Build app vCnafacul
        if: matrix.shard == 1
        run: yarn build
      - name: Install Dotenv-cli
        run: npm install -g dotenv-cli
      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3307 -u root -p123456 --silent 2>/dev/null; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
      - name: Run Migrations
        run: dotenv -e ./test/.env.test -- yarn typeorm migration:run
      - name: Run tests (shard ${{ matrix.shard }}/4)
        # coverageThreshold vazio: um shard sozinho nunca bate 74%; quem confere é o COBERTURA.
        # ⚠️ reporter `json` explícito: o jest-e2e.json só tem text/lcov, e sem o json
        # não existe coverage-final.json para publicar (primeiro run deste card).
        run: dotenv -e ./test/.env.test -- yarn jest --config ./test/config/jest-e2e.json --shard=${{ matrix.shard }}/4 --coverage --coverageThreshold='{}' --coverageReporters=json --coverageReporters=text-summary --forceExit --detectOpenHandles
        timeout-minutes: 10
      - name: Publicar cobertura do shard
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ matrix.shard }}
          path: coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 3
  COBERTURA:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')
    needs: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "yarn"
      - name: Install depends
        # --frozen-lockfile: a CI instala o que está no lock, nunca o atualiza.
        run: yarn install --frozen-lockfile --ignore-engines
      - uses: actions/download-artifact@v4
        with:
          pattern: cobertura-*
          path: coberturas
      - name: Juntar e conferir
        # `find` em vez de glob: sem arquivo o script recebe lista vazia e falha com uso claro.
        run: node test/utils/checar-cobertura.js $(find coberturas -name coverage-final.json)
  PUSH:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Checkout develop para a imagem refletir o estado da branch (evita “sumir” em homol)
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Iniciando CI
        run: echo "Iniciando PUSH"
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "yarn"
      - name: Install depends
        # --frozen-lockfile: a CI instala o que está no lock, nunca o atualiza.
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Build app vCnafacul
        run: yarn build
      - name: Build Image
        run: docker build -t vcnafacul -f node.dockerfile .
      - name: docker tags
        run: docker tag vcnafacul vcnafacul/api:latest
      - name: docker login
        run: docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASSWORD }}
      - name: Image Push
        run: docker push vcnafacul/api:latest
  DEPLOY_HOMOL:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'develop'
    needs: PUSH
    runs-on: ubuntu-latest
    steps:
      - name: Deploy em Homolog (Hostinger)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST_HOMOL }}
          username: ${{ secrets.DEPLOY_USER_HOMOL }}
          password: ${{ secrets.DEPLOY_PASS_HOMOL }}
          script: |
            chmod +x ~/subir_api.sh
            ~/subir_api.sh

  DEPLOY_FIRESTORE_INDEXES:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "yarn"
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Firestore indexes
        run: firebase deploy --only firestore:indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
